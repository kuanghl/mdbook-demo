<h2>WaveDrom Example</h2>

WaveDrom timing diagrams can be embedded into the web pages, blogs, wiki pages:
<p/>

<div style="text-align:center;">
<script type="WaveDrom">
{ signal : [
  { name: "clk",  wave: "p......" },
  { name: "bus",  wave: "x.34.5x",   data: "head body tail" },
  { name: "wire", wave: "0.1..0." },
]}
</script>

<script type="WaveDrom">
{reg: [
    {bits: 11,  name: 'uint32_t g:2'}, 
    {bits: 21,  name: 'uint32_t none', type: 2}, 
    {bits: 32,  name: 'uint64_t assignment', type: 3}, 
]}
</script>
</div>
<p/>
Yes, right in the middle of your page.
